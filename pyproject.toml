[project]
name = "worldview-api"
version = "0.1.0"
description = "Backend for worldview — news ingestion + viewport API"
requires-python = ">=3.12"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "psycopg[binary,pool]",
  "httpx",
  "pydantic-settings",
  "python-dotenv",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/worldview_api"]
